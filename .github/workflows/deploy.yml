name: Deploy to Cloud Run

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Enable required APIs
        run: |
          gcloud services enable run.googleapis.com || true
          gcloud services enable cloudbuild.googleapis.com || true
          gcloud services enable artifactregistry.googleapis.com || true

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy reworkcv-app \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 1 \
            --timeout 300s \
            --set-env-vars=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --quiet

      - name: Show URL
        run: |
          URL=$(gcloud run services describe reworkcv-app --region us-central1 --format="value(status.url)")
          echo "🚀 Deployed: $URL"
          echo "🌐 API: $URL/api/health"
          echo "📚 Docs: $URL/docs"
